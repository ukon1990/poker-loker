apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pokerloker
  namespace: pokerloker
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http01
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - poker-loker.jonaskf.net
      secretName: pokerloker-tls
  rules:
    - host: poker-loker.jonaskf.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pokerloker-frontend
                port:
                  number: 80
