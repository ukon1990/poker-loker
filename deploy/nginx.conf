# nginx setup. Copy into your sites config, then change server_name and root.
# Installing and offline play need HTTPS. Certbot can add it to this block.

server {
    listen 80;
    server_name poker.example.com;
    root /var/www/poker-loker;
    index index.html;

    # Files in assets/ have a content hash in their name, so they never change.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Hidden files are not part of the site. Certbot needs .well-known.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Paths with a file extension stay real 404s, so a missing script is
    # never answered with HTML.
    location ~ \.[^/]+$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Serve the app for routes like /play.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
