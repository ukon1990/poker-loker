    <title>Poker Loker</title>
    <style>
      /* Inline, so the splash paints before any stylesheet or script has loaded. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0e5b49;
        transition: opacity 0.2s ease-out;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      /* The logo image has a margin, so this draws the cards at min(56vw, 240px). */
      #boot img {
        display: block;
        width: min(74.667vw, 320px);
        height: auto;
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><img src="/logo.png" alt="" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
