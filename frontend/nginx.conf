# Used inside the container, behind the cluster's Traefik ingress, which handles HTTPS.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects must not expose the container's own port.
    absolute_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Files in assets/ have a content hash in their name, so they never change.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Hidden files are not part of the site.
    location ~ /\. {
        return 404;
    }

    # Paths with a file extension stay real 404s, so a missing script is
    # never answered with HTML.
    location ~ \.[^/]+$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Serve the app for routes like /play.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
